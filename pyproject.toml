[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
readme = "README.md"
requires-python = ">=3.14"
name = "klipper-auto-image"
version = "0.0.1"
dependencies = [
    "pillow>=12.3.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "websockets>=16.1.1",
]

[tool.setuptools]
packages = ["klipper_auto_image"]
