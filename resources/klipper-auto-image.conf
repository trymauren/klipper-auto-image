ws_uri = "ws://localhost:7125/websocket"
output_dir = "/home/pi/image-data"
fps = 0.05 # 20 sec between each image
post_printing_time = 10

# YOLO failure detection (report only, it never controls the printer). Uncomment to enable.
# [detect]
# model = "/home/pi/printer_data/models/printer-yolo11n-ft-640.onnx"
# conf_threshold = 0.5
# trigger_classes = ["spaghetti", "detached"]
# consecutive_frames = 3 # frames in a row before a failure is reported
# cams = ["nozzle"] # cameras to run on, all if left out

[[cam]]
name = "nozzle"
uri = "http://127.0.0.1:8001/snapshot"

[[cam]]
name = "name"
uri = "http://127.0.0.1:8002/snapshot"
